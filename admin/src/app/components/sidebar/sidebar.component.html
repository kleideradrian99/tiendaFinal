<!-- Navbar (Oculto en pantallas grandes d-lg-none) -->
<header class="navbar navbar-expand navbar-light fixed-top navbar-box-shadow bg-light px-3 d-lg-none" data-scroll-header
    data-fixed-element>
    <a class="navbar-brand mr-auto" [routerLink]="['/inicio']" (click)="closeMenu()">
        <img src="assets/img/logo_prin.png" alt="Mb Latina" width="90">
    </a>
    <button class="navbar-toggler d-block ml-auto" type="button" (click)="toggleMenu()">
        <span class="navbar-toggler-icon"></span>
    </button>
</header>

<!-- Side navigation (Off-canvas) -->
<aside class="cs-offcanvas cs-offcanvas-expand custom-sidebar" id="componentsNav" [class.show]="menuOpen">
    <!-- Header/Logo section -->
    <div
        class="sidebar-header py-4 px-4 border-bottom border-light-subtle d-flex align-items-center justify-content-between">
        <a class="navbar-brand py-1 m-0" [routerLink]="['/inicio']">
            <img src="assets/img/logo_prin.png" alt="Mb Latina" class="sidebar-logo">
        </a>
        <button class="close d-lg-none text-light border-0 bg-transparent" type="button" (click)="toggleMenu()"
            aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <!-- Navigation links container -->
    <div class="sidebar-nav-container flex-grow-1">
        <nav class="nav flex-column custom-nav">
            <a class="custom-nav-link" [routerLink]="['/inicio']" routerLinkActive="active-link" (click)="closeMenu()">
                <i class="cxi-grid mr-3 icon-nav"></i>Inicio
            </a>
            <a *ngIf="['admin', 'asesora', 'direccion'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/clientes']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-profile mr-3 icon-nav"></i>Clientes
            </a>
            <a *ngIf="['admin', 'direccion', 'compras'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/productos']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-bag mr-3 icon-nav"></i>Productos
            </a>
            <a *ngIf="['admin', 'direccion'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/cupones']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-anchor mr-3 icon-nav"></i>Cupones
            </a>
            <a *ngIf="['admin', 'finanzas', 'direccion'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/ventas']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-cart mr-3 icon-nav"></i>Ventas
            </a>
            <a *ngIf="['admin', 'asesora', 'direccion', 'compras', 'logistica'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/pedidos']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-wallet mr-3 icon-nav"></i>Pedidos/Al Mayor
            </a>
            <a *ngIf="['admin', 'direccion'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/descuentos']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-filter-1 mr-3 icon-nav"></i>Descuentos
            </a>
            <a *ngIf="['admin', 'asesora', 'soporte'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/contactos']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-comment mr-3 icon-nav"></i>Mensajes
            </a>
            <a *ngIf="['admin'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/usuarios']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-users mr-3 icon-nav"></i>Usuarios
            </a>
            <a *ngIf="['admin'].includes(user.role)" class="custom-nav-link" [routerLink]="['/panel/configuraciones']" routerLinkActive="active-link"
                (click)="closeMenu()">
                <i class="cxi-settings mr-3 icon-nav"></i>Configuraciones
            </a>
        </nav>
    </div>

    <!-- User Profile Footer (Al final) -->
    <div class="sidebar-footer py-3 px-4 border-top border-light-subtle d-flex align-items-center justify-content-between"
        *ngIf="user.nombres">
        <div class="d-flex align-items-center text-truncate">
            <div class="avatar mr-3 d-flex align-items-center justify-content-center flex-shrink-0">
                {{ user.nombres[0] }}{{ user.apellidos ? user.apellidos[0] : '' }}
            </div>
            <div class="user-info text-truncate">
                <div class="user-name text-truncate" [title]="user.nombres + ' ' + user.apellidos">{{ user.nombres }} {{
                    user.apellidos }}</div>
                <div class="user-role">{{ user.role }}</div>
            </div>
        </div>
        <button
            class="btn-logout bg-transparent border-0 text-light p-2 d-flex align-items-center justify-content-center flex-shrink-0"
            (click)="logout()" title="Cerrar sesión">
            <i class="cxi-logout"></i>
        </button>
    </div>
</aside>
<!-- Backdrop overlay for offcanvas mobile menu -->
<div class="cs-offcanvas-backdrop fade" [class.show]="menuOpen" *ngIf="menuOpen" (click)="closeMenu()"></div>
