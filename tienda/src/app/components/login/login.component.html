<app-nav></app-nav>


<main class="cs-page-wrapper">
  <nav class="bg-secondary mb-3" aria-label="breadcrumb">
    <div class="container">
      <ol class="breadcrumb breadcrumb-alt mb-0">
        <li class="breadcrumb-item">
          <a href="index.html"><i class="cxi-home"></i></a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Checkout</li>
      </ol>
    </div>
  </nav>
  <section class="container pt-3 pt-md-4 pb-3 pb-sm-4 pb-lg-5 mb-4">

    <!-- Selector de Modo: Login / Registro -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-6 col-lg-4 text-center">
        <div class="btn-group w-100" role="group" aria-label="Authentication mode selector">
          <button type="button" class="btn py-2 font-weight-bold"
            [ngClass]="isLogin ? 'btn-primary' : 'btn-outline-primary'" (click)="isLogin = true">
            Iniciar Sesión
          </button>
          <button type="button" class="btn py-2 font-weight-bold"
            [ngClass]="!isLogin ? 'btn-primary' : 'btn-outline-primary'" (click)="isLogin = false">
            Registrarse
          </button>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <!-- Iniciar Sesión Form -->
      <div class="col-md-8 col-lg-6" *ngIf="isLogin">
        <div class="px-md-5">
          <h3 class="modal-title mt-2 mb-2 text-center">Iniciar Sesión</h3>
          <p class="font-size-sm text-muted text-center mb-4">Ingrese a su cuenta usando su correo electrónico y
            contraseña.</p>
          <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">
            <div class="form-group">
              <label for="signin-email">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="Correo electrónico" required="" name="email"
                [(ngModel)]="user.email">
            </div>
            <div class="form-group">
              <label for="signin-password" class="form-label">Contraseña</label>
              <div class="cs-password-toggle input-group-overlay">
                <input type="password" class="form-control appended-form-control" id="signin-password"
                  placeholder="Tu contraseña" required="" name="password" [(ngModel)]="user.password">
                <div class="input-group-append-overlay">
                  <label class="btn cs-password-toggle-btn input-group-text">
                    <input type="checkbox" class="custom-control-input">
                    <i class="cxi-eye cs-password-toggle-indicator"></i>
                    <span class="sr-only">Show password</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center form-group">
              <a href="#" (click)="$event.preventDefault()" class="font-size-sm text-decoration-none">¿Olvidó su
                contraseña?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
            <p class="font-size-sm pt-4 mb-0 text-center">
              ¿No tienes una cuenta?
              <a href="#" (click)="$event.preventDefault(); isLogin = false"
                class="font-weight-bold text-decoration-none">Regístrate</a>
            </p>
          </form>
        </div>
      </div>

      <!-- Registro rápido Form -->
      <div class="col-md-8 col-lg-6" *ngIf="!isLogin">
        <div class="px-md-5">
          <h3 class="modal-title mt-2 mb-2 text-center">Registro rápido</h3>
          <p class="font-size-sm text-muted text-center mb-4">Crea una cuenta en unos segundos ingresando tus datos.</p>
          <form #registroForm="ngForm" (ngSubmit)="registro(registroForm)">
            <div class="form-group">
              <div class="row">
                <div class="col-lg-6">
                  <label>Nombres</label>
                  <input type="text" class="form-control" placeholder="Nombres" required="" name="nombres"
                    [(ngModel)]="nuevoCliente.nombres">
                </div>
                <div class="col-lg-6 mt-3 mt-lg-0">
                  <label>Apellidos</label>
                  <input type="text" class="form-control" placeholder="Apellidos" required="" name="apellidos"
                    [(ngModel)]="nuevoCliente.apellidos">
                </div>
              </div>
            </div>
            <div class="form-group">
              <label for="reg-email">Email</label>
              <input type="email" id="reg-email" class="form-control" placeholder="Tu dirección de correo" required=""
                name="email" [(ngModel)]="nuevoCliente.email">
            </div>
            <div class="form-group">
              <label for="reg-password" class="form-label">Contraseña</label>
              <div class="cs-password-toggle input-group-overlay">
                <input type="password" class="form-control appended-form-control" id="reg-password"
                  placeholder="Tu contraseña" required="" name="password" [(ngModel)]="nuevoCliente.password">
                <div class="input-group-append-overlay">
                  <label class="btn cs-password-toggle-btn input-group-text">
                    <input type="checkbox" class="custom-control-input">
                    <i class="cxi-eye cs-password-toggle-indicator"></i>
                    <span class="sr-only">Show password</span>
                  </label>
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Registrarme</button>
            <p class="font-size-sm pt-4 mb-0 text-center">
              ¿Ya tienes una cuenta?
              <a href="#" (click)="$event.preventDefault(); isLogin = true"
                class="font-weight-bold text-decoration-none">Iniciar Sesión</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </section>

</main>


<app-footer></app-footer>
